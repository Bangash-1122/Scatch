<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C8B0"/>
      <stop offset="100%" stop-color="#DDA68B"/>
    </linearGradient>
    <linearGradient id="bBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F4252"/>
      <stop offset="100%" stop-color="#4F2C3A"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#553432"/>
      <stop offset="50%" stop-color="#734744"/>
      <stop offset="100%" stop-color="#4B2C2A"/>
    </linearGradient>
    <filter id="bShd" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#2D1A23" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bShd)">
    <!-- Handle -->
    <path d="M 38 48 C 38 18, 82 18, 82 48" fill="none" stroke="url(#hGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Bag Body -->
    <g>
      <!-- Top -->
      <path d="M 30 40 C 30 36, 33 34, 38 34 L 82 34 C 87 34, 90 36, 90 40 L 93 68 L 27 68 Z" fill="url(#bTop)"/>
      <!-- Bottom -->
      <path d="M 27 68 L 93 68 L 96 88 C 96 95, 90 99, 84 99 L 36 99 C 30 99, 24 95, 24 88 Z" fill="url(#bBottom)"/>
      <!-- Seam -->
      <line x1="26" y1="68" x2="94" y2="68" stroke="#462432" stroke-width="0.8" stroke-opacity="0.35"/>
      <line x1="26" y1="69" x2="94" y2="69" stroke="#FFF" stroke-width="0.7" stroke-opacity="0.2"/>
    </g>

    <!-- Anchors -->
    <rect x="32" y="44" width="11" height="12" rx="3.5" fill="#4B2C2A" stroke="#663E3B" stroke-width="0.8"/>
    <rect x="34" y="46" width="7" height="8" rx="1.5" fill="#3D201E"/>

    <rect x="77" y="44" width="11" height="12" rx="3.5" fill="#4B2C2A" stroke="#663E3B" stroke-width="0.8"/>
    <rect x="79" y="46" width="7" height="8" rx="1.5" fill="#3D201E"/>
  </g>
</svg>
